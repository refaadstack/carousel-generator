name: carousel-generator

services:
  app:
    build:
      context: ..
    image: carousel-generator:latest
    container_name: carousel-generator-app
    restart: unless-stopped
    shm_size: "1gb"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../assets/brands:/app/assets/brands
      - ../db:/app/db:ro
    ports:
      - "127.0.0.1:8796:3000"
      - "192.168.1.3:8796:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
