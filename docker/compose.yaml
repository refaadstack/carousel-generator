name: carousel-generator

services:
  app:
    build:
      context: ..
    image: carousel-generator:latest
    container_name: carousel-generator-app
    restart: unless-stopped
    shm_size: "1gb"
    env_file: .env
    environment:
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../db:/app/db
    ports:
      - "127.0.0.1:8796:3000"
      - "192.168.1.3:8796:3000"
